<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natureza | Rodrigo Martins</title>
  <style>
    :root { --bg:#0b0b0f; --text:#f6f6f8; --muted:#9ca3af; --accent:#f8b400; --border:rgba(255,255,255,.08); --radius:22px; }
    *{box-sizing:border-box}img{max-width:100%;height:auto;display:block;}
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b0b0f;color:var(--text);line-height:1.6;}
    header{position:sticky;top:0;z-index:10000;display:flex;justify-content:center;align-items:center;padding:20px 36px;backdrop-filter:blur(20px);background:rgba(7,7,10,.95);border-bottom:1px solid var(--border);position:relative;}
    .brand{position:absolute;left:36px;font-size:.95rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);}
    nav{display:flex;gap:72px;}
    nav a{color:#fff;text-decoration:none;font-size:.95rem;transition:color .2s ease;}
    nav a.active,
    nav a:hover{color:var(--accent);}
    @media(max-width:980px){header{justify-content:space-between;align-items:center;padding-bottom:0;}.brand{position:static;left:auto;font-size:0.85rem;white-space:nowrap;}nav{flex-direction:row;align-items:center;justify-content:flex-end;gap:16px;flex-wrap:nowrap;overflow-x:auto;width:auto;}nav::-webkit-scrollbar{display:none;}}    main{width:min(1120px,calc(100%-32px));max-width:1120px;margin:0 auto;padding:24px 20px 64px;}
    .section-title{margin-bottom:24px;}
    .section-title h2{font-size:2.8rem;margin:0;}
    .section-title h1{font-family:'Carl Brown',Georgia,serif;font-size:clamp(3rem,5vw,4.5rem);line-height:0.95;margin:0;}
    .section-text{color:var(--muted);max-width:760px;margin:18px 0 24px;}
    .portfolio-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px;position:relative;z-index:1;}
    .portfolio-item{position:relative;display:block;width:100%;aspect-ratio:4 / 5;border-radius:0;overflow:hidden;border:none;background:transparent;padding:0;z-index:0;cursor:pointer;}
    .portfolio-item img{width:100%;height:auto;object-fit:contain;transition:transform .2s ease;display:block;}
    .portfolio-item:hover img{transform:scale(1.02);}
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:10001;}
    .lightbox.active{opacity:1;pointer-events:auto;}
    .lightbox-panel{position:relative;width:min(100%,1080px);max-height:90vh;display:flex;align-items:center;justify-content:center;}
    .lightbox-content{width:100%;max-height:90vh;}
    .lightbox img{width:100%;height:auto;display:block;max-height:90vh;object-fit:contain;}
    .lightbox-button,.lightbox-close{position:absolute;border:none;background:rgba(255,255,255,.08);color:#fff;width:48px;height:48px;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.5rem;}
    .lightbox-button:hover,.lightbox-close:hover{background:rgba(255,255,255,.18);}
    .lightbox-close{top:-10px;right:-10px;}
    .lightbox-button.prev{left:-60px;}
    .lightbox-button.next{right:-60px;}
    
    
    .back-link{display:inline-flex;margin-top:32px;margin-bottom:32px;padding:12px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.16);color:#fff;text-decoration:none;background:rgba(255,255,255,.05);}
    .back-link:hover{background:rgba(248,180,0,.15);}
    @media(max-width:980px){.portfolio-grid{grid-template-columns:repeat(2,minmax(0,1fr));}.lightbox-button.prev{left:12px;}.lightbox-button.next{right:12px;}}
    @media(max-width:680px){.portfolio-grid{grid-template-columns:repeat(2,minmax(0,1fr));}header{padding:16px 18px;}nav{gap:16px;} .section-title h1{font-size:2.6rem;} .back-link{padding:12px 18px;}}
      @media (max-width: 980px) {
      header { justify-content: center; align-items: center; padding-bottom: 0; flex-wrap: wrap; gap: 12px; }
      .brand { position: static; left: auto; font-size: 0.85rem; white-space: nowrap; width: 100%; text-align: center; }
      nav {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
        overflow-x: auto;
        width: 100%;
      }
      nav::-webkit-scrollbar { display: none; }
    }

    @media (max-width: 680px) {
      header { justify-content: center; align-items: center; padding-bottom: 0; flex-wrap: wrap; gap: 12px; }
      .brand { position: static; left: auto; font-size: 0.85rem; white-space: nowrap; width: 100%; text-align: center; }
      nav {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
        overflow-x: auto;
        width: 100%;
      }
      nav::-webkit-scrollbar { display: none; }
      header { padding: 16px 18px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">RODRIGO MARTINS</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">Sobre</a>
      <a href="portfolio.html">Fotografia</a>
      <a href="arquitetura.html">Arquitetura</a>
    </nav>
  </header>
  <main>
    <section>
      <div class="section-title">
        <h1>Natureza</h1>
      </div>
      <a class="back-link" href="portfolio.html">← Voltar à galeria</a>
      <div id="gallery" class="portfolio-grid"></div>
      <div id="lightbox" class="lightbox">
        <div class="lightbox-panel">
          <button type="button" class="lightbox-close" aria-label="Fechar">×</button>
          <button type="button" class="lightbox-button prev" aria-label="Anterior">‹</button>
          <div class="lightbox-content"><img src="" alt="Imagem de fotografia"></div>
          <button type="button" class="lightbox-button next" aria-label="Seguinte">›</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    var images = [
      "nature (1).JPG","nature (10).JPG","nature (11).JPG","nature (12).JPG","nature (13).JPG","nature (14).JPG","nature (15).JPG","nature (2).JPG","nature (3).JPG","nature (4).JPG","nature (5).JPG","nature (6).JPG","nature (7).JPG","nature (8).JPG","nature (9).JPG","nature.JPG", "nature1.JPG", "nature2.JPG", "nature3.JPG", "nature4.JPG", "nature5.JPG", "nature6.JPG", "nature7.JPG", "nature8.JPG", "nature9.JPG"
    ];
    var gallery = document.getElementById('gallery');
    function shuffle(array) {
      for (var i = array.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = array[i];
        array[i] = array[j];
        array[j] = temp;
      }
    }
    var lightbox = document.getElementById('lightbox');
    var lightboxImage = lightbox.querySelector('img');
    var closeBtn = lightbox.querySelector('.lightbox-close');
    var prevBtn = lightbox.querySelector('.lightbox-button.prev');
    var nextBtn = lightbox.querySelector('.lightbox-button.next');
    var currentIndex = 0;
    shuffle(images);
    var html = '';
    for (var i = 0; i < images.length; i++) {
      var name = images[i];
      html += '<div class="portfolio-item" data-index="' + i + '"><img src="' + encodeURI(name) + '" alt="Nature image"></div>';
    }
    gallery.innerHTML = html;
    gallery.querySelectorAll('.portfolio-item').forEach(function(item) {
      item.addEventListener('click', function() {
        currentIndex = parseInt(item.getAttribute('data-index'), 10);
        openLightbox(currentIndex);
      });
    });
    function openLightbox(index) {
      currentIndex = index;
      lightboxImage.src = encodeURI(images[currentIndex]);
      lightbox.classList.add('active');
    }
    function closeLightbox() {
      lightbox.classList.remove('active');
    }
    function changeLightbox(delta) {
      currentIndex = (currentIndex + delta + images.length) % images.length;
      lightboxImage.src = encodeURI(images[currentIndex]);
    }
    prevBtn.addEventListener('click', function(event) { event.stopPropagation(); changeLightbox(-1); });
    nextBtn.addEventListener('click', function(event) { event.stopPropagation(); changeLightbox(1); });
    closeBtn.addEventListener('click', function(event) { event.stopPropagation(); closeLightbox(); });
    lightbox.addEventListener('click', function(event) { if (event.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', function(event) {
      if (!lightbox.classList.contains('active')) return;
      if (event.key === 'ArrowLeft') changeLightbox(-1);
      if (event.key === 'ArrowRight') changeLightbox(1);
      if (event.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
